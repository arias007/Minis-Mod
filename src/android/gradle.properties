org.gradle.jvmargs=-Xmx3000m -XX:MaxMetaspaceSize=800m -XX:+UseSerialGC -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.aapt2FromMavenOverride=/var/minis/workspace/ombuild/wrap/aapt2
# [local-build] NDK host tools ship as x86_64 only; these wrappers run them
# under qemu-x86_64 with a Debian glibc sysroot.
# [local-build] Two JVMs (Gradle + Kotlin daemon) cannot both hold a heap in
# this 11 GB device. In-process keeps the whole 23k-line Kotlin compile in ONE
# JVM with one heap budget, which is what actually fits.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
# [local-build] Compile Kotlin INSIDE the Gradle JVM. The separate Kotlin daemon
# is a second multi-GB process, and on a phone the kernel kills whichever one
# it decides to reap mid-compile. One process with one big heap is both smaller
# in total and predictable.
kotlin.compiler.execution.strategy=in-process
